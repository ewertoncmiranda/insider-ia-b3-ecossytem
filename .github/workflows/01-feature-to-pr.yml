name: Auto PR Feature to Develop

on:
  push:
    branches:
      - 'feature**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # a mesma da imagem (Dockerfile)

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # So testes na esteira (decisao de 2026-10-07): sem lint e sem piso de cobertura.
      - name: Tests
        run: pytest -v

  create-pr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const title = `Merge ${branch} into develop`;
            const body = `## Automated PR\n\nPR aberto automaticamente a partir de **${branch}** depois dos testes.`;

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'develop',
              state: 'open',
            });

            if (prs.data.length === 0) {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: branch,
                base: 'develop',
                body: body,
              });
              console.log(`PR criado: #${pr.data.number} ${pr.data.html_url}`);
            } else {
              console.log(`PR ja existe: #${prs.data[0].number}`);
            }
