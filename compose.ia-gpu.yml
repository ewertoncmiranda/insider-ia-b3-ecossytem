# Reserva a GPU NVIDIA para o Ollama. Some depois de compose.ia.yml:
#   docker compose -f ../infra-b3-ecossytem/docker-compose-local.yml -f compose.ia.yml -f compose.ia-gpu.yml \
#       --profile ia up -d
# Falha com "no adapters were found" quando o Docker nao enxerga a GPU (driver/WSL2). Neste PC isso
# acontece em 2026-10-07: use o Ollama instalado no Windows (OLLAMA_URL) ate o Docker enxergar a GPU.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
