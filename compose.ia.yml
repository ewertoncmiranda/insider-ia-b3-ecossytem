# Servico de IA (opiniao por horizonte, chat, card e resumo de manchetes). Camada opcional sobre o
# compose local da infra:
#
#   docker compose -f ../infra-b3-ecossytem/docker-compose-local.yml -f compose.ia.yml --profile ia up -d
#   # verificar (a rede `ia` nao publica porta no host):
#   docker compose -f ../infra-b3-ecossytem/docker-compose-local.yml -f compose.ia.yml exec ia-opiniao #       python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/saude').read().decode())"
#
# Provedor: so Gemini (DEC-IA-11, 2026-10-08); a chave fica em .env.ia (DEC-IA-09). Sem Gemini, lote e
# card respondem pela regra e o chat fica indisponivel. Nao ha mais Ollama nem modelo local.
#
# Caminhos relativos resolvem a partir da pasta do PRIMEIRO -f (a infra), por isso o contexto de
# build usa IA_CONTEXT (padrao: ../insider-ia-b3-ecossytem).
#
# Redes (SPEC 4.3): `ia` e `internal: true` liga o ia-opiniao a quem o chama (gerar-insights, painel e
# gestor). A rede `saida` da internet somente ao ia-opiniao, para a API do Gemini.
# O MySQL NAO entra na rede `ia`: quem atende /opiniao nao acessa o banco (NFR-IA-06).
services:
  ia-opiniao:
    image: ewertonmiranda/insider-ia-b3-ecossytem:${B3_IMAGEM_TAG:-develop}
    build:
      context: ${IA_CONTEXT:-../insider-ia-b3-ecossytem}
    container_name: ia-opiniao
    profiles: ["ia"]
    restart: unless-stopped
    env_file:
      - path: ${IA_CONTEXT:-../insider-ia-b3-ecossytem}/.env.ia
        required: false
    environment:
      RAG_INDICE: /app/var/rag.sqlite
      GESTOR_URL: http://gestor-ativos-brutos:8091
      LOG_LEVEL: INFO
    volumes:
      - ia_indice:/app/var   # indice do RAG: derivado das fichas, refeito por POST /indexar
    networks:
      - ia
      - saida
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # O job `python -m app.opiniao.gerar` (gerar-insights) fala com o ia-opiniao pela rede `ia`.
  gerar-insights:
    environment:
      IA_URL: http://ia-opiniao:8000
    networks:
      - observability
      - ia

  # O painel chama /ia/* em si mesmo; o proxy interno remove /ia e encaminha para ia-opiniao.
  painel-ativos-frontend:
    environment:
      IA_URL: http://ia-opiniao:8000
    networks:
      - observability
      - ia

  # O pacote do ativo e as ferramentas do chat leem apenas GETs do gestor.
  gestor-ativos-brutos:
    networks:
      - observability
      - ia

volumes:
  ia_indice:

networks:
  ia:
    internal: true
  saida:
    driver: bridge
